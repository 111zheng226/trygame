<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#2a1a0a;display:flex;justify-content:center;user-select:none}
#app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:#f5f0e8}
#top{height:46px;display:flex;align-items:center;padding:0 12px;gap:10px;background:linear-gradient(180deg,#6d4c2a,#4a2f1a);color:#fff;flex-shrink:0}
#home{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:18px;width:34px;height:34px;border-radius:8px;cursor:pointer}
#prog{flex:1;text-align:center;font-size:14px;font-weight:bold;letter-spacing:1px}
#coin{font-size:13px;font-weight:bold;background:rgba(255,215,0,.2);color:#ffd700;border:1px solid rgba(255,215,0,.5);padding:4px 10px;border-radius:12px}
#stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#3a2a1a}
#scene{width:100%;height:100%}
#scene svg{width:100%;height:100%;display:block}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.shiver{animation:shiver .3s infinite}
.breathe{animation:breathe 3s ease-in-out infinite}
.pg{transform-origin:180px 340px}
.hs{cursor:pointer}
.hs .rg{transform-box:fill-box;transform-origin:center;animation:pr 1.4s infinite ease-out}
@keyframes pr{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.55);opacity:0}}
.hs .dt{animation:db 1.4s infinite ease-in-out}
@keyframes db{0%,100%{opacity:.5}50%{opacity:1}}
#bub{position:absolute;top:14px;left:50%;transform:translateX(-50%) scale(.9);background:#fffdf5;border:2px solid #6d4c2a;border-radius:14px;padding:10px 16px;font-size:14px;color:#3a2a1a;font-weight:bold;max-width:82%;line-height:1.4;box-shadow:0 6px 16px rgba(0,0,0,.3);opacity:0;transition:.25s;z-index:3;text-align:center}
#bub::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#6d4c2a}
#bub.on{opacity:1;transform:translateX(-50%) scale(1)}
#case{background:#fffaf0;border-top:3px solid #6d4c2a;padding:8px 14px;min-height:60px;max-height:96px;overflow-y:auto;font-size:12px;color:#5a4a30;flex-shrink:0}
#case b{color:#6d4c2a}
#caseContent{line-height:1.6;margin-top:4px}
#caseContent .s{color:#b34100;font-weight:bold}
#caseContent .p{color:#1565c0;font-weight:bold}
#acts{padding:10px 14px 16px;background:#f0e6d0;border-top:2px solid #d4c4a8;flex-shrink:0;min-height:76px;display:flex;flex-direction:column;gap:8px}
.tip{font-size:13px;color:#6b5a3a;text-align:center;font-weight:bold;line-height:1.4}
.btn{display:block;width:100%;font-size:15px;font-weight:bold;padding:11px;border:2px solid #6d4c2a;border-radius:12px;background:linear-gradient(180deg,#d4a574,#b8845a);color:#3a2a1a;cursor:pointer;box-shadow:0 3px 0 #6d4c2a}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6d4c2a}
.opt{display:block;width:100%;text-align:left;font-size:15px;font-weight:bold;padding:12px 16px;margin-bottom:6px;border:2px solid #8b7355;border-radius:12px;background:#fffdf5;color:#4a3a20;cursor:pointer}
.opt:active{transform:scale(.98);background:#f0e6d0}
.opt.ok{background:#c5e1a5;border-color:#33691e;color:#1a3a00}
.opt.no{background:#ffcdd2;border-color:#c62828;color:#7a1010}
.opt:disabled{cursor:default}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
#mo.on{display:flex}
.mbox{background:#f5f0e8;border-radius:20px;padding:26px 30px;text-align:center;width:100%;max-width:320px;border:3px solid #6d4c2a}
.mbox h3{font-size:20px;color:#6d4c2a;margin-bottom:10px}
.mbox p{font-size:14px;color:#5a4a30;margin-bottom:20px;line-height:1.5;white-space:pre-line}
.mbox button{display:block;width:100%;font-size:16px;font-weight:bold;padding:12px;border:2px solid #6d4c2a;border-radius:12px;background:linear-gradient(180deg,#d4a574,#b8845a);color:#3a2a1a;cursor:pointer;box-shadow:0 3px 0 #6d4c2a}
</style>

}

];var ST={INTRO:0,OBSERVE:1,INQUIRY:2,PULSE:3,DIAG:4};
var curIdx=0,curP=null,state=ST.INTRO,wrongCount=0,obsWrong=0,syms=[],pulseTxt='';
var timers=[];
function $(id){return document.getElementById(id)}
var sceneEl=$('scene'),bubEl=$('bub'),caseC=$('caseContent'),actsEl=$('acts'),progEl=$('prog'),coinEl=$('coin');
var moEl=$('mo'),mTEl=$('mT'),mXEl=$('mX'),mBEl=$('mB');
function later(f,ms){timers.push(setTimeout(f,ms))}
function clrAll(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[]}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function showBub(t){bubEl.textContent=t;bubEl.classList.add('on')}
function hideBub(){bubEl.classList.remove('on')}
function updCoin(){coinEl.textContent='💰 '+getCoins()}
function updProg(){progEl.textContent='病人 '+(curIdx+1)+' / '+PATIENTS.length}
function renderCase(){
if(!syms.length&&!pulseTxt){caseC.textContent='尚未开始诊治';return}
var h='';
if(syms.length){h+='<div><b>症状：</b>';for(var i=0;i<syms.length;i++){if(i)h+='、';h+='<span class="s">'+syms[i]+'</span>'}h+='</div>'}
if(pulseTxt)h+='<div><b>脉象：</b><span class="p">'+pulseTxt+'</span></div>';
caseC.innerHTML=h;
}
function showModal(t,x,bt,cb){mTEl.textContent=t;mXEl.textContent=x;mBEl.textContent=bt;moEl.classList.add('on');mBEl.onclick=function(){moEl.classList.remove('on');if(cb)cb()}}
function bindHotspot(el){
el.onclick=function(){if(el.dataset.id==='pulse'){onPulse()}else{onHsClick(el)}};
}
function renderScene(o){
sceneEl.innerHTML=buildScene(o.p,o.pulse,o.hs,o.ac);
var hs=sceneEl.querySelectorAll('.hs');
for(var i=0;i<hs.length;i++)bindHotspot(hs[i]);
}
function setState(s){state=s;render()}
function render(){
if(state===ST.INTRO)rIntro();
else if(state===ST.OBSERVE)rObserve();
else if(state===ST.INQUIRY)rInquiry();
else if(state===ST.PULSE)rPulse();
else if(state===ST.DIAG)rDiag();
}
function rIntro(){
var ac=curP.pose==='hug'?'shiver':'breathe';
renderScene({p:curP,pulse:false,hs:[],ac:ac});
actsEl.innerHTML='<div class="tip">👀 '+curP.intro+'</div><button class="btn" id="bOb">开始望诊</button>';
$('bOb').onclick=function(){sfx.click();setState(ST.OBSERVE)};
}
function rObserve(){
obsWrong=0;
var ac=curP.pose==='hug'?'shiver':'breathe';
renderScene({p:curP,pulse:false,hs:curP.observe.hotspots,ac:ac});
actsEl.innerHTML='<div class="tip">'+curP.observe.hint+'</div>';
}
function onHsClick(el){
var ok=el.dataset.correct==='true';
if(ok){
sfx.correct();showBub('✅ '+curP.observe.correctMsg);
var d=el.querySelector('.dt');if(d)d.setAttribute('fill','rgba(120,220,120,.95)');
var rs=el.querySelectorAll('.rg');for(var i=0;i<rs.length;i++){rs[i].setAttribute('stroke','rgba(120,220,120,.95)');rs[i].style.animation='none'}
setTimeout(function(){setState(ST.INQUIRY)},1500);
return;
}
sfx.wrong();obsWrong++;
var h=null;for(var i=0;i<curP.observe.hotspots.length;i++)if(curP.observe.hotspots[i].id===el.dataset.id)h=curP.observe.hotspots[i];
var msg=h?h.msg:'这里没有异常。';
var rs=el.querySelectorAll('.rg');for(var j=0;j<rs.length;j++)rs[j].setAttribute('stroke','rgba(255,80,80,.95)');
setTimeout(function(){var r2=el.querySelectorAll('.rg');for(var k=0;k<r2.length;k++)r2[k].setAttribute('stroke','rgba(255,215,80,.95)')},350);
if(obsWrong>=3){
var all=sceneEl.querySelectorAll('.hs');for(var m=0;m<all.length;m++)all[m].style.pointerEvents='none';
showBub('❌ '+msg);
actsEl.innerHTML='<div class="tip" style="color:#c62828">❌ 望诊失误三次，病人对你失去信任……</div>';
setTimeout(function(){showModal('😵 望诊失败','你连续三次没有找准病位，'+curP.name+' 摇头坐了回去。','重新接诊',function(){obsWrong=0;syms=[];pulseTxt='';wrongCount=0;loadP(curIdx)})},800);
}else{
showBub('❌ '+msg+'（'+obsWrong+'/3）');
actsEl.innerHTML='<div class="tip">'+curP.observe.hint+'（错误 '+obsWrong+'/3）</div>';
setTimeout(hideBub,1200);
}
}
function rInquiry(){
hideBub();
renderScene({p:curP,pulse:false,hs:[],ac:'breathe'});
actsEl.innerHTML='<div class="tip">💬 病人正在诉说症状……</div>';
var ss=curP.inquiry.symptoms;
for(var i=0;i<ss.length;i++)(function(idx){setTimeout(function(){
showBub('「'+ss[idx]+'」');
if(syms.indexOf(ss[idx])<0)syms.push(ss[idx]);
renderCase();sfx.click();
var g=sceneEl.querySelector('.pg');
if(g){g.classList.remove('breathe');g.classList.add('shiver');setTimeout(function(){g.classList.remove('shiver');g.classList.add('breathe')},420)}
},700+idx*700)})(i);
setTimeout(function(){
showBub(curP.inquiry.doneMsg||'（病人沉默）');
actsEl.innerHTML='<div class="tip">问诊完毕，接下来请为病人切脉。</div><button class="btn" id="bPul">切脉</button>';
$('bPul').onclick=function(){sfx.click();setState(ST.PULSE)};
},700+ss.length*700);
}
function rPulse(){
hideBub();
renderScene({p:curP,pulse:true,ac:'breathe',hs:[{id:'pulse',cx:256,cy:382,r:28,correct:true}]});
actsEl.innerHTML='<div class="tip">🩺 伸出右手，点击病人手腕为其把脉</div>';function onPulse(){
sfx.correct();pulseTxt=curP.pulse.text;renderCase();
showBub('脉象：'+pulseTxt);
var e=sceneEl.querySelector('.hs[data-id="pulse"]');if(e)e.style.display='none';
actsEl.innerHTML='<div class="tip">四诊已毕，请判断病人的方证。</div><button class="btn" id="bDi">开始辨证</button>';
document.getElementById('bDi').onclick=function(){sfx.click();setState(ST.DIAG)};
}
function rDiag(){
hideBub();
renderScene({p:curP,pulse:true,hs:[],ac:'breathe'});
var opts=shuf(curP.diagnose.options);
var h='<div class="tip">🧠 根据四诊所得，判断病人属于哪一证（剩余机会 '+(2-wrongCount)+'）</div>';
for(var i=0;i<opts.length;i++)h+='<button class="opt" data-opt="'+opts[i]+'">'+opts[i]+'</button>';
actsEl.innerHTML=h;
var bs=actsEl.querySelectorAll('.opt');
for(var j=0;j<bs.length;j++)(function(b){b.onclick=function(){onDiag(b)}})(bs[j]);
}
function onDiag(btn){
var picked=btn.dataset.opt,correct=curP.diagnose.answer;
if(picked===correct){
sfx.win();btn.classList.add('ok');
var bs=actsEl.querySelectorAll('.opt');for(var i=0;i<bs.length;i++)bs[i].disabled=true;
var rw=10+curIdx*5;setCoins(getCoins()+rw);updCoin();
setTimeout(function(){
showModal('✅ 辨证正确',
curP.name+' 患的是「'+correct+'」，当用「'+curP.diagnose.formula+'」。\n'+curP.diagnose.desc+'。\n\n💰 获得 '+rw+' 铜币',
'继续',function(){
curIdx++;
if(curIdx>=PATIENTS.length){
showModal('🎉 今日行医完毕','你已诊治完所有病人，共获得铜币 '+getCoins()+'。','返回主页',function(){location.href='index.html'});
}else loadP(curIdx);
});
},800);
}else{
sfx.lose();wrongCount++;btn.classList.add('no');btn.disabled=true;
if(wrongCount>=2){
actsEl.innerHTML='<div class="tip" style="color:#c62828">❌ 两次辨证皆错，病人生气地离开了……</div>';
var g=sceneEl.querySelector('.pg');if(g)g.style.opacity='.4';
setTimeout(function(){
showModal('😠 辨证失败',curP.name+' 摇头离去了。你决定重新整理思路，请他再来一次。','重新接诊',function(){
wrongCount=0;obsWrong=0;syms=[];pulseTxt='';loadP(curIdx);
});
},500);
}else{
var tip=actsEl.querySelector('.tip');if(tip)tip.textContent='❌ 错了，「'+picked+'」不对。再想想（剩余机会 1）';
var g2=sceneEl.querySelector('.pg');
if(g2){g2.classList.remove('breathe');g2.classList.add('shiver');setTimeout(function(){g2.classList.remove('shiver');g2.classList.add('breathe')},500)}
}
}
}
function loadP(idx){
clrAll();
curP=PATIENTS[idx];
wrongCount=0;obsWrong=0;syms=[];pulseTxt='';
updProg();renderCase();hideBub();
setState(ST.INTRO);
}
updCoin();loadP(0);
$('home').onclick=function(){location.href='index.html'};
</script>
